<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 Expense Tracker</h1>
      <p class="subtitle">Track your spending. Master your money.</p>
    </header>

    <!-- Summary Cards -->
    <section class="summary">
      <div class="card income">
        <span class="label">Income</span>
        <span class="amount" id="total-income">₹0</span>
      </div>
      <div class="card expense">
        <span class="label">Expenses</span>
        <span class="amount" id="total-expense">₹0</span>
      </div>
      <div class="card balance">
        <span class="label">Balance</span>
        <span class="amount" id="total-balance">₹0</span>
      </div>
    </section>

    <main>
      <!-- Form -->
      <section class="form-section">
        <h2>Add Transaction</h2>
        <form id="transaction-form">
          <div class="form-row">
            <label for="type">Type</label>
            <select id="type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>
          <div class="form-row">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g. Lunch, Salary, Movie" required maxlength="60" />
          </div>
          <div class="form-row">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" placeholder="e.g. 250" min="1" step="0.01" required />
          </div>
          <div class="form-row">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health">Health</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-row">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>
          <button type="submit" class="btn add-btn">+ Add Transaction</button>
        </form>
      </section>

      <!-- Transactions + Chart -->
      <section class="list-section">
        <div class="list-header">
          <h2>Transactions</h2>
          <div class="filters">
            <select id="filter-category">
              <option value="all">All Categories</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health">Health</option>
              <option value="Other">Other</option>
            </select>
            <button class="btn clear-btn" id="clear-all">Clear All</button>
          </div>
        </div>
        <ul id="transaction-list"></ul>
        <p id="empty-message" class="empty hidden">No transactions yet. Add your first one above!</p>
      </section>

      <section class="chart-section">
        <h2>Spending by Category</h2>
        <canvas id="category-chart"></canvas>
      </section>
    </main>

    <footer>
      <p>Built with vanilla JavaScript · Data stored locally in your browser</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
